name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish even if the tag already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate version
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must be a semantic version such as 1.2.3 (got '$version')"
            exit 1
          fi
          tag="v$version"

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
          elif gh release view "$tag" >/dev/null 2>&1; then
            tag_exists=true
          fi

          if [[ "$tag_exists" == 'true' && "$FORCE" != 'true' ]]; then
            publish=false
          else
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          {
            echo "### Release decision"
            echo ""
            echo "| key | value |"
            echo "| --- | --- |"
            echo "| VERSION | \`$version\` |"
            echo "| tag | \`$tag\` |"
            echo "| tag or release exists | \`$tag_exists\` |"
            echo "| force | \`${FORCE:-false}\` |"
            echo "| publish | \`$publish\` |"
            echo ""
            if [[ "$publish" != 'true' ]]; then
              echo "Release \`$tag\` already exists. Bump \`VERSION\`, or re-run this"
              echo "workflow manually with **force** enabled to republish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            compiler: g++
            package: ''
          - arch: arm64
            compiler: aarch64-linux-gnu-g++
            package: g++-aarch64-linux-gnu
          - arch: arm32
            compiler: arm-linux-gnueabihf-g++
            package: g++-arm-linux-gnueabihf
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        if: matrix.package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }}
      - name: Build
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -pedantic \
            src/bad_apple_linux.cpp -o bad-apple-linux-${{ matrix.arch }}
          file bad-apple-linux-${{ matrix.arch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad-apple-linux-${{ matrix.arch }}
          path: bad-apple-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /O2 /EHsc /MT src\bad_apple_windows.cpp /Fe:bad-apple-windows-amd64.exe /link winmm.lib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad-apple-windows-amd64
          path: bad-apple-windows-amd64.exe
          if-no-files-found: error

  windows-arm32:
    needs: version
    runs-on: windows-2022
    # The ARM32 (v143 ARM) toolset is optional on the hosted image, so a
    # missing toolchain must not block the rest of the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows ARM32
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm
          cl /nologo /std:c++17 /O2 /EHsc /MT src\bad_apple_windows.cpp /Fe:bad-apple-windows-arm32.exe /link winmm.lib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad-apple-windows-arm32
          path: bad-apple-windows-arm32.exe
          if-no-files-found: error

  release:
    needs: [version, linux, windows, windows-arm32]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bad-apple-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        run: |
          cp install.sh bad-apple.sh bad-apple.ps1 bad-apple.cmd bad-apple-rt.ps1 dist/
          chmod +x dist/bad-apple-linux-* dist/install.sh dist/bad-apple.sh
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Bad Apple $VERSION" \
            --generate-notes \
            --latest
