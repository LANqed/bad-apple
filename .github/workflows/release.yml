name: Build and release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read and validate version
        id: read
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must be a semantic version such as 1.2.3" >&2
            exit 1
          fi
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            publish=false
            echo "Release $tag already exists; nothing to publish."
          else
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            compiler: g++
            package: ''
          - arch: arm64
            compiler: aarch64-linux-gnu-g++
            package: g++-aarch64-linux-gnu
          - arch: arm32
            compiler: arm-linux-gnueabihf-g++
            package: g++-arm-linux-gnueabihf
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        if: matrix.package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }}
      - name: Build
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -pedantic \
            src/bad_apple_linux.cpp -o bad-apple-linux-${{ matrix.arch }}
          file bad-apple-linux-${{ matrix.arch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad-apple-linux-${{ matrix.arch }}
          path: bad-apple-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /O2 /EHsc src\bad_apple_windows.cpp /Fe:bad-apple-windows-amd64.exe /link winmm.lib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bad-apple-windows-amd64
          path: bad-apple-windows-amd64.exe
          if-no-files-found: error

  release:
    needs: [version, build, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bad-apple-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        run: |
          cp install.sh bad-apple.sh bad-apple.ps1 bad-apple.cmd bad-apple-rt.ps1 dist/
          chmod +x dist/bad-apple-linux-* dist/install.sh dist/bad-apple.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Bad Apple $VERSION" \
            --generate-notes \
            --latest
